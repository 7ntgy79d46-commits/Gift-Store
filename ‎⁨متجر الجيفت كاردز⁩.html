<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر الجيفت كاردز</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f3f8;--surface:#fff;--ink:#101828;--mute:#5d6678;--line:#dde1ea;--accent:#5b3df5;--on-accent:#fff;--warn:#ffb020;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--surface:#171b30;--ink:#eef0f8;--mute:#9aa2bb;--line:#2a3050;--accent:#8c78ff}}
:root[data-theme="dark"]{--bg:#0d1020;--surface:#171b30;--ink:#eef0f8;--mute:#9aa2bb;--line:#2a3050;--accent:#8c78ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;max-width:900px;margin:auto}
h1{font-size:1.5rem;font-weight:800;margin:0}
.sub{color:var(--mute);margin:0 18px 12px;max-width:900px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cartbtn{background:var(--accent);color:var(--on-accent);padding:8px 16px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 12px;max-width:900px;margin:auto}
.chip{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:6px 14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:6px 18px 40px;max-width:900px;margin:auto}
.card{aspect-ratio:1.6;border-radius:16px;padding:12px;color:#fff;text-align:right;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-weight:800;font-size:1.05rem;transition:transform .15s}
.card:hover{transform:rotate(-1.5deg) translateY(-2px)}
.card::before{content:"";position:absolute;inset:0 auto 0 -20%;width:45%;background:rgba(255,255,255,.14);transform:skewX(-18deg)}
.card small{font-weight:400;opacity:.85;position:relative}
.card span{position:relative}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.panel h2{margin:0 0 4px;font-size:1.2rem}
.vals{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.val{border:1.5px solid var(--line);background:none;color:var(--ink);padding:8px 14px;font-weight:600}
.val[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.qty button{width:34px;height:34px;background:var(--bg);color:var(--ink);font-size:1.2rem}
.qty b{display:inline-block;min-width:30px;text-align:center}
.primary{width:100%;background:var(--accent);color:var(--on-accent);padding:12px;font-weight:800;margin-top:10px}
.ghost{background:none;color:var(--mute);width:100%;padding:8px;margin-top:4px}
input{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:6px 0}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item button{background:none;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:20px 0}
.note{font-size:.85rem;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<header><h1 id="sname"></h1><button class="cartbtn" id="openCart">السلة (<span id="cnt">0</span>)</button></header>
<p class="sub">كروت هدايا رقمية، الكود يوصلك على واتساب بعد تأكيد الدفع.</p>
<div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
<main class="grid" id="grid"></main>

<div class="sheet" id="pSheet"><div class="panel" id="pPanel"></div></div>
<div class="sheet" id="cSheet"><div class="panel" id="cPanel"></div></div>

<script>
/* ===== عدّل هنا ===== */
const CONFIG={store:"متجر الجيفت كاردز",whatsapp:"201000000000",currency:"ج.م"};
const CARDS=[
{id:"psn",name:"بلايستيشن ستور",cat:"ألعاب",color:"#1b4fd8",vals:[250,500,1000,2000]},
{id:"xbox",name:"إكس بوكس",cat:"ألعاب",color:"#16803c",vals:[300,600,1200]},
{id:"steam",name:"ستيم",cat:"ألعاب",color:"#1f3a5f",vals:[200,500,1000]},
{id:"roblox",name:"روبلوكس",cat:"ألعاب",color:"#c2410c",vals:[100,200,400,800]},
{id:"apple",name:"آي تيونز / أبل",cat:"تطبيقات",color:"#3b3f4a",vals:[250,500,1000]},
{id:"gplay",name:"جوجل بلاي",cat:"تطبيقات",color:"#0f766e",vals:[200,400,800]},
{id:"netflix",name:"نتفليكس",cat:"ترفيه",color:"#b91c1c",vals:[300,600]},
{id:"spotify",name:"سبوتيفاي",cat:"ترفيه",color:"#15803d",vals:[150,300]}
];
/* السعر هنا = القيمة الاسمية. غيّر الأسعار الفعلية حسب سعرك */
const price=(c,v)=>v;
/* ===================== */
let cart=[],cat="الكل";
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString("ar-EG")+" "+CONFIG.currency;
$("sname").textContent=CONFIG.store;document.title=CONFIG.store;

function chips(){const cats=["الكل",...new Set(CARDS.map(c=>c.cat))];
$("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
$("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();grid()})}
function grid(){$("grid").innerHTML=CARDS.filter(c=>cat==="الكل"||c.cat===cat).map(c=>
`<button class="card" style="background:linear-gradient(135deg,${c.color},#000a)" data-id="${c.id}"><small>${c.cat}</small><span>${c.name}</span></button>`).join("");
$("grid").querySelectorAll(".card").forEach(b=>b.onclick=()=>product(b.dataset.id))}

function product(id){const c=CARDS.find(x=>x.id===id);let v=c.vals[0],q=1;
const p=$("pPanel");
function draw(){p.innerHTML=`<h2>${c.name}</h2><div class="note">اختار القيمة</div>
<div class="vals">${c.vals.map(x=>`<button class="val" aria-pressed="${x===v}" data-v="${x}">${fmt(x)}</button>`).join("")}</div>
<div class="row"><span>الكمية</span><span class="qty"><button data-d="-1" aria-label="أقل">−</button><b>${q}</b><button data-d="1" aria-label="أكثر">+</button></span></div>
<div class="row"><b>الإجمالي</b><b>${fmt(price(c,v)*q)}</b></div>
<button class="primary" id="add">أضف للسلة</button><button class="ghost" id="x">إغلاق</button>`;
p.querySelectorAll(".val").forEach(b=>b.onclick=()=>{v=+b.dataset.v;draw()});
p.querySelectorAll(".qty button").forEach(b=>b.onclick=()=>{q=Math.max(1,Math.min(20,q+ +b.dataset.d));draw()});
$("add").onclick=()=>{const e=cart.find(i=>i.id===id&&i.v===v);e?e.q+=q:cart.push({id,name:c.name,v,q});upd();$("pSheet").classList.remove("open")};
$("x").onclick=()=>$("pSheet").classList.remove("open")}
draw();$("pSheet").classList.add("open")}

const total=()=>cart.reduce((s,i)=>s+i.v*i.q,0);
function upd(){$("cnt").textContent=cart.reduce((s,i)=>s+i.q,0)}
function openCart(){const p=$("cPanel");
function draw(){
if(!cart.length){p.innerHTML=`<h2>السلة</h2><div class="empty">السلة فاضية. اختار كارت من القائمة.</div><button class="ghost" id="cx">إغلاق</button>`;$("cx").onclick=()=>$("cSheet").classList.remove("open");return}
p.innerHTML=`<h2>السلة</h2>${cart.map((i,k)=>`<div class="item"><span>${i.name} ${fmt(i.v)} × ${i.q}</span><button data-k="${k}" aria-label="حذف">حذف</button></div>`).join("")}
<div class="row"><b>الإجمالي</b><b>${fmt(total())}</b></div>
<input id="nm" placeholder="الاسم" autocomplete="name"><input id="ph" placeholder="رقم الموبايل" inputmode="tel" autocomplete="tel">
<button class="primary" id="send">اطلب على واتساب</button><button class="ghost" id="cx">رجوع</button>
<div class="note">هيتفتح واتساب برسالة الطلب جاهزة. الدفع والتسليم بيتم هناك.</div>`;
p.querySelectorAll(".item button").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.k,1);upd();draw()});
$("cx").onclick=()=>$("cSheet").classList.remove("open");
$("send").onclick=()=>{const n=$("nm").value.trim(),ph=$("ph").value.trim();
if(!n||!ph){(n?$("ph"):$("nm")).focus();return}
const msg=`طلب جديد\nالاسم: ${n}\nالموبايل: ${ph}\n`+cart.map(i=>`- ${i.name} ${i.v} × ${i.q}`).join("\n")+`\nالإجمالي: ${total()} ${CONFIG.currency}`;
window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank")}}
draw();$("cSheet").classList.add("open")}
$("openCart").onclick=openCart;
["pSheet","cSheet"].forEach(i=>$(i).onclick=e=>{if(e.target.id===i)e.target.classList.remove("open")});
chips();grid();
</script>
</body>
</html>
